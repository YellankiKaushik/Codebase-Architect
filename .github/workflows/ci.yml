name: CI

on:
  push:
    branches: ["main"]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package
        run: python -m pip install -e .
      - name: Unit and integration tests
        run: python -m unittest discover -s tests -v
      - name: Deterministic eval harness
        run: codebase-architect eval --json
      - name: CLI smoke test
        run: |
          codebase-architect doctor --json
          codebase-architect providers --json
          codebase-architect analyze . --no-llm --output .tmp/generated --json
          codebase-architect validate .tmp/generated --json

  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Build distribution
        run: |
          python -m pip install build
          python -m build
      - name: Wheel install smoke test
        run: |
          python -m venv .tmp/wheel-venv
          . .tmp/wheel-venv/bin/activate
          python -m pip install dist/*.whl
          codebase-architect doctor --json
          mkdir -p .tmp/skill-fixture
          codebase-architect skill install .tmp/skill-fixture --json
