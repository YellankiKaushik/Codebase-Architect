[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "codebase-architect"
version = "0.1.0"
description = "Local-first codebase intelligence, engineering documentation, and architecture diagram generator."
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
authors = [{name = "Codebase Architect contributors"}]
keywords = ["codebase", "architecture", "documentation", "agent-skill", "ollama", "gemma"]
dependencies = []
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Documentation",
  "Topic :: Software Development :: Documentation",
  "Topic :: Software Development :: Quality Assurance",
]

[project.scripts]
codebase-architect = "codebase_architect.cli:main"

[project.urls]
Repository = "https://github.com/YellankiKaushik/Codebase-Architect"
Issues = "https://github.com/YellankiKaushik/Codebase-Architect/issues"
Documentation = "https://github.com/YellankiKaushik/Codebase-Architect/tree/main/docs"
Security = "https://github.com/YellankiKaushik/Codebase-Architect/security"

[project.optional-dependencies]
javascript = [
  "tree-sitter>=0.25,<0.26",
  "tree-sitter-javascript>=0.25,<0.26",
  "tree-sitter-typescript>=0.23,<0.24",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
codebase_architect = ["resources/*.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[dependency-groups]
dev = [
  "build",
  "pytest",
]
